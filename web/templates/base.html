<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ brand }}{% endblock %}</title>
<meta name="description" content="{% block desc %}Find out whether AI assistants recommend your business when customers ask.{% endblock %}">
<style>
  :root{
    color-scheme:light;
    --surface:#fcfcfb; --plane:#f9f9f7;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --rule:#c3c2b7;
    --accent:#2a78d6; --accent-ink:#fff; --warn:#d03b3b; --good:#0ca30c;
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])){
      color-scheme:dark;
      --surface:#1a1a19; --plane:#0d0d0d;
      --ink:#fff; --ink-2:#c3c2b7; --muted:#898781; --rule:#383835;
      --accent:#3987e5; --warn:#e66767;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --surface:#1a1a19; --plane:#0d0d0d;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781; --rule:#383835;
    --accent:#3987e5; --warn:#e66767;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
    font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
  a{color:var(--accent)}
  header{display:flex;justify-content:space-between;align-items:center;
    padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:34px;gap:12px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:18px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
  .logo span{color:var(--accent)}
  h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin:0 0 14px}
  h2{font-size:20px;margin:34px 0 12px}
  p{color:var(--ink-2);margin:0 0 15px}
  .lead{font-size:18px;color:var(--ink-2)}
  section{background:var(--surface);border:1px solid var(--rule);border-radius:12px;
    padding:22px;margin:22px 0}
  .btn{display:inline-block;background:var(--accent);color:var(--accent-ink);
    padding:13px 22px;border-radius:9px;text-decoration:none;font-weight:600;border:0;
    cursor:pointer;font-size:16px;font-family:inherit}
  .btn:hover{opacity:.92}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--ink)}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:8px;
    background:var(--plane);color:var(--ink);font:inherit;font-size:16px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.row{grid-template-columns:1fr}h1{font-size:25px}}
  .err{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid var(--warn);
    color:var(--ink);padding:11px 13px;border-radius:8px;margin-bottom:16px;font-size:14px}
  .quote{border-left:3px solid var(--accent);padding:4px 0 4px 16px;margin:18px 0;
    color:var(--ink);font-size:17px}
  ul{color:var(--ink-2);padding-left:20px}li{margin-bottom:9px}
  .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
  @media (max-width:860px){.tiers{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:430px){.tiers{grid-template-columns:1fr}}
  .tier{background:var(--surface);padding:16px}
  .tier .n{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .tier .p{font-size:25px;font-weight:700;margin:5px 0}
  .tier .p small{font-size:13px;color:var(--muted);font-weight:500}
  .tier .d{font-size:13px;color:var(--ink-2)}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);
    color:var(--muted);font-size:13px;line-height:1.7}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">Answer<span>Rank</span></a>
    <a href="#audit" class="btn" style="padding:9px 15px;font-size:14px">Free audit</a>
  </header>
  {% block body %}{% endblock %}
  <footer>
    <strong>{{ company }}</strong><br>
    {% if address and 'SET_YOUR' not in address %}{{ address }}<br>
    {% else %}<span style="color:var(--warn)">[business address not configured —
    run <code>python3 run.py doctor</code>]</span><br>{% endif %}
    <a href="mailto:{{ contact_email }}">{{ contact_email }}</a> ·
    <a href="/privacy">Privacy</a> ·
    <a href="/terms">Terms</a> ·
    <a href="/unsubscribe">Unsubscribe</a>
  </footer>
</div>
</body>
</html>
